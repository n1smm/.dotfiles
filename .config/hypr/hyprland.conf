
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

#autogenerated = 1 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=eDP-1,1920x1200@60,0x0,1
# monitor=DP-1,1920x1080@60,0x-1080,1
monitor=HDMI-A-1,1920x1080@60,0x-1080,1
# monitor=DP-2,1280x720@60,0x-1080,1
#big monitor
# monitor=HDMI-A-1,2560x1440@59.95,0x-1440,1
#small monitor
# monitor=HDMI-A-1,1920x1080@60,0x-1080,1
# input:touchdevice:output = auto
# input:touchdevice:enabled = true
# input:touchdevice:transform = 0

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
 exec-once = bash .extra_storage.sh;exit
 exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
 exec-once = swww img ~/Pictures/animated_wallpapers/empty_bed.png --outputs eDP-1
 exec-once = swww img ~/Pictures/animated_wallpapers/ellie3.webp --outputs HDMI-A-1
 #exec-once = swww img ~/Pictures/animated_wallpapers/ellie3.webp --outputs DP-1
 exec-once = waybar & hyprpaper & ulauncher & swww-daemon
 exec-once = ./lock.sh
 # exec-once = swayidle & disown


# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,si
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }
	touchdevice {
		enabled = true
		output = auto
		transform = 0
	}

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 15
    border_size = 3
    col.active_border = rgb(b19062) rgb(442408) 45deg
    col.inactive_border = rgb(241e04)
	cursor_inactive_timeout = 5

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 20
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 2
    col.shadow = rgba(1a1a1aee)
	active_opacity = 0.85
	inactive_opacity = 0.9
	col.shadow = rgb(2e1b04)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
	workspace_swipe_touch = true
	workspace_swipe_invert = true
	workspace_swipe_create_new = true
	workspace_swipe_forever = true
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
	disable_hyprland_logo = true
	mouse_move_enables_dpms = true
	animate_manual_resizes = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

#keymaps / keybinds
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, TAB, exec, $terminal
# bind = $mainMod, TAB, exec, $terminal --cwd="$(hyprcwd)"
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, S, togglesplit, # dwindle
bind = $mainMod, F, fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


#resizing floating windows to sides
bindm = SUPER_CTRL, mouse:272, resizewindow
bind = SUPER, L, resizeactive, exact 50% 95%
bind = SUPER, L, moveactive, exact 50% 5%
bind = SUPER, H, resizeactive, exact 50% 95%
bind = SUPER, H, moveactive, exact 0% 5%
bind = SUPER, K, resizeactive, exact 100% 49%
bind = SUPER, K, moveactive, exact 0% 5%
bind = SUPER, J, resizeactive, exact 100% 49%
bind = SUPER, J, moveactive, exact 0% 51%

#resizing windows by increments
binde = Ctrl_l SHIFT, up, exec, /home/thiew/.scripts/resize_window.sh up
binde = Ctrl_l SHIFT, down, exec, /home/thiew/.scripts/resize_window.sh down
binde = Ctrl_l SHIFT, left, exec, /home/thiew/.scripts/resize_window.sh left
binde = Ctrl_l SHIFT, right, exec, /home/thiew/.scripts/resize_window.sh right

#workspace switching
bind = Ctrl_l Alt_l, l, workspace, +1
bind = Ctrl_l Alt_l, h, workspace, -1
bind = Ctrl_l Alt_l, right, workspace, +1
bind = Ctrl_l Alt_l, left, workspace, -1

#move active window to workspace/monitor
bind = SUPER SHIFT, h, movetoworkspace, -1
bind = SUPER SHIFT, l, movetoworkspace, +1
bind = SUPER SHIFT, k, movewindow, mon:+1
bind = SUPER SHIFT, j, movewindow, mon:-1
bind = SUPER SHIFT, left, movetoworkspace, -1
bind = SUPER SHIFT, right, movetoworkspace, +1
bind = SUPER SHIFT, up, movewindow, mon:+1
bind = SUPER SHIFT, down, movewindow, mon:-1


# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#move windows keybinds
bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d


#app keybinds
bind = Ctrl_l, SPACE, exec, ulauncher
bind = $mainMod, C, exec, google-chrome -new-window
bind = , XF86Favorites, exec, grim -g "$(slurp -d)" - | wl-copy
bind = , XF86Calculator, exec, gnome-calculator
bind = $mainMod, b, exec, python3 /home/thiew/.scripts/change_kitty_bg.py


# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Special Keys
binde = , xf86monbrightnessup, exec, brightnessctl set 5%+
binde = , xf86monbrightnessdown, exec, brightnessctl set 5%-
# binde = , xf86monbrightnessup, exec, /home/thiew/.scripts/control_brightness.sh +
# binde = , xf86monbrightnessdown, exec, /home/thiew/.scripts/control_brightness.sh -
binde = , xf86audioraisevolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%+
binde = , xf86audiolowervolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%-
binde = , xf86audiomute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
# trigger when the switch is toggled
bindl=,switch:on:Lid Switch,exec,swaylock

# Screensaver and lock screen
# Swaylock configuration in ~/.config/swaylock/config
# $lock = swaylock
# exec-once = swayidle -w timeout 300 '$lock' timeout 300 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep '$lock'
#

windowrulev2 = float,class:(radio),title:(radio)
windowrulev2 = opacity 0.7,class:(radio),title:(radio)
windowrulev2 = size 610 700,class:(radio),title:(radio)
windowrulev2 = move 1300 60,class:(radio),title:(radio)
windowrulev2 = float,class:(visualizer),title:(visualizer)
windowrulev2 = size 610 700,class:(visualizer),title:(visualizer)
windowrulev2 = move 1300 60,class:(visualizer),title:(visualizer)

windowrulev2 = size 300 50,class:(small),title:(small)
windowrulev2 = move 50 60,class:(small),title:(small)
windowrulev2 = float,class:(small),title:(small)


