#remap of starting prefix
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

#split panes 
bind [ split-window -h \; run-shell "~/.config/tmux/border-colors.sh"
bind ] split-window -v \; run-shell "~/.config/tmux/border-colors.sh"
bind x kill-pane \; run-shell "~/.config/tmux/border-colors.sh"
unbind '"'
unbind %

#switch panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


#mouse control
set -g mouse on

#don't rename windows automatically
set-option -g allow-rename off

#default shell
set-option -g default-shell /bin/zsh

#the looks
set-option -ga terminal-overrides ',*:Tc'

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- Color Theme ---
set -g default-terminal "screen-256color"
set -g status-style "bg=#010a0a fg=#93672e"

# --- Clock mode ---
setw -g clock-mode-colour '#4c566a'

# --- Copy mode ---
setw -g mode-style "fg=#010a0a bg=#ffb347 bold"   # Black on Amber Glow

# --- Pane Borders ---
set -g pane-border-style "fg=#2e9367"             # Ocean Teal
set -g pane-active-border-style "fg=#93672e"      # Bronze

# --- Status Bar ---
set -g status-position bottom
set -g status-justify left

set -g status-left ""                             # Empty left section
set -g status-left-length 10

set -g status-right-style "fg=#010a0a bg=#ffb347" # Black on Amber Glow
set -g status-right "%Y-%m-%d %H:%M "
set -g status-right-length 50

# --- Window Status ---
setw -g window-status-current-style "fg=#010a0a bg=#ffb347 bold"  # Black on Amber
setw -g window-status-current-format " #I #[bold]#W #F "

setw -g window-status-style "fg=#2e9367 bg=#010a0a"  # Ocean Teal on black
setw -g window-status-format " #I #[fg=#3e5c76]#W #[fg=#ffb347]#F "

setw -g window-status-bell-style "fg=#ffb347 bg=#3e5c76 bold"

# --- Messages (like prompts and notifications) ---
set -g message-style "fg=#ffb347 bg=#2e9367 bold"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- TPM Initialization (keep at bottom) ---
run '~/.tmux/plugins/tpm/tpm'

